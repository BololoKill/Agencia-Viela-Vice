<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>AGÊNCIA VIELA VICE — Sistema 6 Estrelas</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #090d16; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; }
  #top { height: 58px; flex-shrink: 0; background: #111625; border-bottom: 1px solid #263044; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; z-index: 100; }
  .title { font-size: 16px; font-weight: 800; }
  .sub { font-size: 11px; color: #fbbf24; font-weight: 600; }
  .metrics { display: flex; gap: 60px; text-align: center; font-size: 12px; }
  .metrics b { display: block; font-size: 14px; margin-top: 2px; }
  .btn-top { background: #2563eb; color: #fff; border: none; border-radius: 6px; padding: 7px 16px; font-weight: 700; cursor: pointer; transition: 0.2s; }
  .btn-top:hover { filter: brightness(1.2); transform: scale(1.04); }
  
  #stage { position: relative; flex: 1; width: 100%; height: calc(100vh - 58px); background: url('/escritorio_img') center/100% 100% no-repeat; overflow: hidden; }
  .box { position: absolute; background: rgba(13, 18, 30, 0.90); border: 1px solid #334155; border-radius: 8px; padding: 10px; font-size: 11px; box-shadow: 0 6px 18px rgba(0,0,0,0.6); z-index: 25; }

  /* Camada dinâmica dos agentes com profundidade isométrica e caminhada suave */
  #camada-agentes { position: absolute; inset: 0; pointer-events: none; }
  .agente {
    position: absolute;
    width: 88px;
    transform: translate(-50%, -75%);
    transition: left 2.8s cubic-bezier(0.25, 1, 0.5, 1), top 2.8s cubic-bezier(0.25, 1, 0.5, 1);
    cursor: pointer;
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
  }
  .agente:hover { filter: drop-shadow(0 0 12px #38bdf8); }
  .agente img {
    height: 84px;
    width: auto;
    image-rendering: pixelated;
    display: block;
    pointer-events: none;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.85));
  }
  .bubble {
    background: rgba(13, 18, 30, 0.92);
    border: 1px solid #475569;
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 10.5px;
    max-width: 195px;
    line-height: 1.25;
    box-shadow: 0 4px 14px rgba(0,0,0,0.85);
    margin-bottom: 3px;
    white-space: normal;
    text-align: center;
    pointer-events: none;
    transition: all 0.3s ease;
  }
  .bubble.alerta { border-color: #f59e0b; color: #fde047; }
  .bubble.cafe { border-color: #ec4899; color: #fbcfe8; }
  .bubble.celular { border-color: #06b6d4; color: #a5f3fc; }
  .bubble.reuniao { border-color: #22c55e; color: #86efac; }
  .tag-nome {
    background: rgba(2, 6, 23, 0.88);
    color: #94a3b8;
    font-size: 9.5px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 4px;
    margin-top: -2px;
    white-space: nowrap;
  }

  #dock { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); width: max-content; background: rgba(13, 18, 30, 0.94); border: 1px solid #334155; border-radius: 14px; padding: 8px 14px; display: flex; justify-content: center; gap: 10px; z-index: 1000; }
  .btn { background: #1d4ed8; color: #fff; border: none; border-radius: 8px; padding: 8px 14px; font-size: 11px; font-weight: 700; cursor: pointer; min-width: 88px; line-height: 1.2; transition: 0.15s; }
  .btn:hover { filter: brightness(1.15); transform: translateY(-2px); }
  .btn-red { background: #dc2626; }
  #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.84); align-items: center; justify-content: center; z-index: 2000; }
  #modal-in { background: #0f172a; border: 2px solid #3b82f6; border-radius: 12px; width: 85%; max-width: 720px; max-height: 88vh; overflow-y: auto; padding: 20px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
  select, input, textarea { width: 100%; background: #090d16; color: #fff; border: 1px solid #475569; border-radius: 6px; padding: 8px; margin-top: 6px; font-family: inherit; font-size: 12px; }
  .row-btns { display: flex; gap: 10px; margin-top: 14px; }
  .act-btn { flex: 1; border: none; border-radius: 6px; padding: 10px; font-weight: 700; color: #fff; cursor: pointer; font-size: 12px; }
</style>
</head>
<body>
<div id="top">
  <div><div class="title">AGÊNCIA VIELA VICE</div><div class="sub">★ Curadoria &amp; Controle de Qualidade</div></div>
  <div class="metrics">
    <div>Estoque Fila (0-60)<b style="color:#fbbf24" id="m-est">0</b></div>
    <div>Envios de Hoje<b style="color:#34d399" id="m-env">0/42</b></div>
    <div>Faturamento Est.<b id="m-fat">R$ 1240.0</b></div>
  </div>
  <button class="btn-top" onclick="abrirReuniao()">Reunião</button>
</div>

<div id="stage">
  <div class="box" style="top:14px; left:16px; width:245px;">
    <div style="display:flex; justify-content:space-between; color:#facc15; font-weight:700;"><span>⚡ Estoque de Gordura (0-60)</span><span id="g-pct">0%</span></div>
    <div id="g-msg" style="color:#cbd5e1; font-size:10px; margin-top:4px;">Varredura ativa e gerando estoque...</div>
  </div>

  <div class="box" style="top:82px; left:16px; width:245px;">
    <div style="display:flex; justify-content:space-between; font-size:10px; color:#94a3b8; border-bottom:1px solid #1e293b; padding-bottom:5px; margin-bottom:6px;">
      <span>&gt;_ Console de Qualidade &amp; T.I.</span><span style="color:#22c55e; font-weight:700;">● ONLINE</span>
    </div>
    <div id="logs" style="font-family:monospace; font-size:9.5px; color:#93c5fd; line-height:1.4; max-height:155px; overflow-y:auto;">
      <div>Sistema iniciado com sucesso. Rede de 7 canais auditada.</div>
    </div>
  </div>

  <!-- Camada Dinâmica dos Agentes Vivos -->
  <div id="camada-agentes"></div>

  <div id="dock">
    <button class="btn" id="b-dir" onclick="abrirAvaliacao()">Diretoria<br>(0)</button>
    <button class="btn" onclick="abrirCuradoriaTop()">Curadoria<br>Top</button>
    <button class="btn" id="b-fila" onclick="abrirFila()">Fila YouTube<br>(0)</button>
    <button class="btn" onclick="abrirNivel()">★ Nível 6<br>Estrelas</button>
    <button class="btn" onclick="abrirSuporteTI()">Suporte<br>T.I.</button>
    <button class="btn btn-red" id="b-var" onclick="toggleVarredura()">Stop<br>Varredura</button>
    <button class="btn" onclick="atualizarTudo()">Atualizar</button>
  </div>
</div>

<div id="modal" onclick="if(event.target===this)fecharModal()">
  <div id="modal-in">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; border-bottom:1px solid #1e293b; padding-bottom:8px;">
      <h3 id="m-tit"></h3>
      <button onclick="fecharModal()" style="background:#ef4444; color:#fff; border:none; padding:5px 12px; border-radius:6px; font-weight:700; cursor:pointer;">Fechar</button>
    </div>
    <div id="m-txt" style="font-size:13px; line-height:1.5;"></div>
  </div>
</div>

<script src="/painel.js"></script>
</body>
</html>
