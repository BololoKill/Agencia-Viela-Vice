<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>AGÊNCIA VIELA VICE — Canal Dark de GTA 6</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #090d16; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; }
  #top { height: 58px; flex-shrink: 0; background: #111625; border-bottom: 1px solid #263044; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; z-index: 100; }
  .title { font-size: 16px; font-weight: 800; }
  .sub { font-size: 11px; color: #fbbf24; font-weight: 600; }
  .metrics { display: flex; gap: 48px; text-align: center; font-size: 12px; }
  .metrics span { display: block; font-size: 10px; color: #94a3b8; margin-top: 1px; }
  .metrics b { display: block; font-size: 14px; margin-top: 2px; }
  .btn-top { background: #2563eb; color: #fff; border: none; border-radius: 6px; padding: 7px 16px; font-weight: 700; cursor: pointer; transition: 0.2s; }
  .btn-top:hover { filter: brightness(1.2); transform: scale(1.04); }
  
  #stage { position: relative; flex: 1; width: 100%; height: calc(100vh - 58px); background: #16103f; overflow: hidden; }
  .box { position: absolute; background: rgba(13, 18, 30, 0.90); border: 1px solid #334155; border-radius: 8px; padding: 10px; font-size: 11px; box-shadow: 0 6px 18px rgba(0,0,0,0.6); z-index: 1200; }

  /* Cenário do escritório desenhado em código */
  #cena { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  #camera { position: absolute; top: 14px; right: 16px; z-index: 1100; display: flex; flex-direction: column; gap: 6px; }
  #camera button { width: 38px; height: 38px; background: rgba(13, 18, 30, 0.9); color: #e2e8f0; border: 1px solid #475569; border-radius: 8px; font-size: 18px; font-weight: 700; line-height: 1; cursor: pointer; }
  #camera button:hover { background: #1d4ed8; }
  #camera button:focus-visible { outline: 2px solid #38bdf8; outline-offset: 2px; }

  #dock { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); width: max-content; background: rgba(13, 18, 30, 0.94); border: 1px solid #334155; border-radius: 14px; padding: 8px 14px; display: flex; justify-content: center; gap: 10px; z-index: 1000; }
  .btn { background: #1d4ed8; color: #fff; border: none; border-radius: 8px; padding: 8px 14px; font-size: 11px; font-weight: 700; cursor: pointer; min-width: 88px; line-height: 1.2; transition: 0.15s; }
  .btn:hover { filter: brightness(1.15); transform: translateY(-2px); }
  .btn-red { background: #dc2626; }
  #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.84); align-items: center; justify-content: center; z-index: 2000; }
  #modal-in { background: #0f172a; border: 2px solid #3b82f6; border-radius: 12px; width: 85%; max-width: 720px; max-height: 88vh; overflow-y: auto; padding: 20px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
  select, input, textarea { width: 100%; background: #090d16; color: #fff; border: 1px solid #475569; border-radius: 6px; padding: 8px; margin-top: 6px; font-family: inherit; font-size: 12px; }
  .row-btns { display: flex; gap: 10px; margin-top: 14px; }
  .act-btn { flex: 1; border: none; border-radius: 6px; padding: 10px; font-weight: 700; color: #fff; cursor: pointer; font-size: 12px; }
  .act-btn:disabled, .btn:disabled { opacity: 0.55; cursor: wait; }

  /* Console de T.I. e saúde da produção */
  #g-msg { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  #g-barra { display: none; height: 4px; margin-top: 7px; background: #1e293b; border-radius: 3px; overflow: hidden; }
  #g-barra-fill { height: 100%; width: 0; background: linear-gradient(90deg, #ec4899, #38bdf8); transition: width 0.6s ease; }
  .log-linha { white-space: pre-wrap; overflow-wrap: anywhere; }
  .log-erro { color: #fca5a5; }
  .log-aviso { color: #fde68a; }
  .log-ok { color: #86efac; }
  .status-ao-vivo { display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 9.5px; letter-spacing: 0.4px; margin-bottom: 2px; }
  .ponto-ao-vivo { width: 9px; height: 9px; flex-shrink: 0; border-radius: 50%; background: #22c55e; border: 1px solid #dcfce7; animation: pulso-ao-vivo 1.6s ease-out infinite; }
  .ponto-ao-vivo.desligado { background: #94a3b8; border-color: #cbd5e1; animation: none; }
  @keyframes pulso-ao-vivo {
    0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.85); }
    70% { box-shadow: 0 0 0 7px rgba(34, 197, 94, 0); }
    100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
  }
  @media (prefers-reduced-motion: reduce) { .ponto-ao-vivo { animation: none; } }
  #estrelas-canal { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 6px; padding: 7px 10px; background: #090d16; border: 1px solid #334155; border-radius: 6px; font-size: 11px; color: #94a3b8; }
  .estrelas { font-size: 16px; letter-spacing: 2px; white-space: nowrap; }
  .estrela-cheia { color: #facc15; }
  .estrela-vazia { color: #475569; }
  #btn-copiar-console { display: block; min-height: 26px; margin: 7px 0 0 auto; padding: 4px 10px; background: #1e293b; color: #cbd5e1; border: 1px solid #475569; border-radius: 5px; font-size: 10px; font-weight: 700; cursor: pointer; transition: background 0.15s, color 0.15s, border-color 0.15s; }
  #btn-copiar-console:hover { background: #334155; color: #fff; }
  #btn-copiar-console:focus-visible { outline: 2px solid #38bdf8; outline-offset: 2px; }
  #btn-copiar-console.copiado { border-color: #22c55e; color: #86efac; }
  #btn-copiar-console.falhou { border-color: #ef4444; color: #fca5a5; }
  #aviso { display: none; position: fixed; top: 68px; left: 50%; transform: translateX(-50%); z-index: 3000; max-width: min(560px, 90vw); padding: 10px 16px; border-radius: 8px; border: 1px solid #475569; background: #1e293b; color: #e2e8f0; font-size: 12px; font-weight: 600; box-shadow: 0 8px 22px rgba(0,0,0,0.6); }
  #aviso.ok { border-color: #22c55e; color: #bbf7d0; }
  #aviso.aviso { border-color: #f59e0b; color: #fde68a; }
  #aviso.erro { border-color: #ef4444; color: #fecaca; }
  /* Guia da equipe e das funções */
  .funcao { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; }
  .funcao .etapa { width: 30px; height: 30px; border-radius: 50%; background: #1d4ed8; color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 13px; }
  .funcao.agora { border-color: #22c55e; box-shadow: 0 0 0 1px #22c55e inset; }
  .funcao.agora .etapa { background: #16a34a; }
  .funcao h4 { font-size: 13px; margin-bottom: 2px; }
  .funcao .quem { font-size: 11px; color: #fbbf24; font-weight: 700; }
  .funcao p { font-size: 12px; color: #cbd5e1; margin-top: 4px; }
  .funcao .status-agora { font-size: 11px; color: #86efac; margin-top: 4px; font-weight: 700; }
  .botao-funcao { margin-top: 8px; background: #2563eb; color: #fff; border: none; border-radius: 6px; padding: 6px 12px; font-size: 11px; font-weight: 700; cursor: pointer; }
  .guia-secao { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.6px; margin: 14px 0 8px; }
  .guia-botoes td { padding: 6px 8px; border-bottom: 1px solid #1e293b; font-size: 12px; vertical-align: top; }
  .guia-botoes td:first-child { white-space: nowrap; font-weight: 700; color: #e2e8f0; }
  .tabela-virais td { padding: 5px 8px; border-bottom: 1px solid #1e293b; font-size: 12px; }
  .tabela-virais td:last-child { text-align: right; color: #fbbf24; white-space: nowrap; }
  #g-quem { font-size: 10px; color: #fbbf24; margin-top: 4px; font-weight: 700; }
</style>
</head>
<body>
<div id="top">
  <div><div class="title">AGÊNCIA VIELA VICE</div><div class="sub">★ Canal dark de GTA 6 · virais da semana narrados por IA</div></div>
  <div class="metrics">
    <div title="Vídeos prontos esperando a sua aprovação (limite de 9: 6 Shorts e 3 longos)">Na Diretoria<b style="color:#fbbf24" id="m-est">0</b><span>esperando você</span></div>
    <div title="Vídeos enviados hoje: 1 longo e 2 Shorts por dia">Publicação de hoje<b style="color:#34d399" id="m-env">0/3</b><span>1 longo + 2 Shorts</span></div>
    <div title="Números reais do canal no YouTube">Canal no YouTube<b id="m-canal">—</b><span id="m-canal-sub">inscritos</span></div>
  </div>
  <button class="btn-top" onclick="abrirReuniao()" title="Reúne a equipe e explica a função de cada um e de cada botão">👥 Equipe e funções</button>
</div>

<div id="stage">
  <div class="box" style="top:14px; left:16px; width:245px;">
    <div style="display:flex; justify-content:space-between; color:#facc15; font-weight:700;"><span>⚙️ Produção agora</span><span id="g-pct" title="Ocupação do estoque da Diretoria">0%</span></div>
    <div id="g-msg" style="color:#cbd5e1; font-size:10px; margin-top:4px;">Conectando à produção...</div>
    <div id="g-barra"><div id="g-barra-fill"></div></div>
    <div id="g-quem"></div>
  </div>

  <div class="box" style="top:104px; left:16px; width:245px;">
    <div style="display:flex; justify-content:space-between; gap:8px; font-size:10px; color:#94a3b8; border-bottom:1px solid #1e293b; padding-bottom:5px; margin-bottom:6px;">
      <span>&gt;_ Registro da produção</span><span id="console-status" style="color:#94a3b8; font-weight:700; white-space:nowrap;">● CONECTANDO</span>
    </div>
    <div id="logs" role="log" aria-live="polite" style="font-family:monospace; font-size:9.5px; color:#93c5fd; line-height:1.4; max-height:155px; overflow-y:auto;">
      <div>Conectando ao console da produção...</div>
    </div>
    <button id="btn-copiar-console" type="button" onclick="copiarConsole()">Copiar console</button>
  </div>

  <!-- Escritório virtual animado -->
  <canvas id="cena" role="img" aria-label="Escritório da Agência Viela Vice: clique em uma pessoa da equipe para ver a função dela"></canvas>

  <div id="camera" role="group" aria-label="Controles da visão do escritório">
    <button type="button" onclick="zoomCentral(1.25)" aria-label="Aproximar" title="Aproximar (ou role o mouse)">+</button>
    <button type="button" onclick="zoomCentral(0.8)" aria-label="Afastar" title="Afastar (ou role o mouse)">&minus;</button>
    <button type="button" onclick="restaurarCamera()" aria-label="Voltar à visão inicial" title="Voltar à visão inicial (ou clique duas vezes no cenário)">&#8634;</button>
  </div>

  <div id="dock">
    <button class="btn" id="b-dir" onclick="abrirAvaliacao()" title="Assistir, aprovar ou rejeitar os vídeos prontos">Diretoria<br>(0)</button>
    <button class="btn" id="b-fila" onclick="abrirFila()" title="Vídeos já enviados que ainda vão ao ar">Fila YouTube<br>(0)</button>
    <button class="btn" id="b-niv" onclick="abrirNivel()" title="Quantos vídeos o canal recebeu hoje e em que horário">Publicação<br>0/3</button>
    <button class="btn" id="b-virais" onclick="abrirVirais()" title="Os vídeos de GTA 6 mais vistos escolhidos no último ciclo">Virais<br>da vez</button>
    <button class="btn" onclick="abrirSuporteTI()" title="Computador, IA do Google e limpeza de temporários">Suporte<br>T.I.</button>
    <button class="btn btn-red" id="b-var" aria-label="Pausar varredura" onclick="toggleVarredura()">❚❚ Pausar<br>Varredura</button>
    <button class="btn" onclick="atualizarTudo()">Atualizar</button>
  </div>
</div>

<div id="modal" onclick="if(event.target===this)fecharModal()">
  <div id="modal-in">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; border-bottom:1px solid #1e293b; padding-bottom:8px;">
      <h3 id="m-tit"></h3>
      <button onclick="fecharModal()" style="background:#ef4444; color:#fff; border:none; padding:5px 12px; border-radius:6px; font-weight:700; cursor:pointer;">Fechar</button>
    </div>
    <div id="m-txt" style="font-size:13px; line-height:1.5;"></div>
  </div>
</div>

<div id="aviso" role="status" aria-live="polite"></div>

<script src="/escritorio.js"></script>
<script src="/painel.js"></script>
</body>
</html>
